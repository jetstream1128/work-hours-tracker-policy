<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Work Hours Tracker - Legal</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #141414;
        --text: #f2f2f2;
        --muted: #b8b8b8;
        --accent: #d8b06a;
        --border: #2b2b2b;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, #1a1a1a 0%, var(--bg) 55%);
        color: var(--text);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      .card {
        margin-top: 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        overflow: hidden;
      }
      .item {
        display: block;
        padding: 18px 20px;
        color: var(--text);
        text-decoration: none;
        border-top: 1px solid var(--border);
      }
      .item:first-child {
        border-top: 0;
      }
      .item:hover {
        background: #1a1a1a;
      }
      .label {
        font-weight: 600;
      }
      .hint {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        margin-top: 12px;
        border: 1px solid #6d5328;
        color: #f3d999;
        background: #2a1f0f;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ultimate Work Hours Tracker</h1>
      <p>Legal documents and policy pages for the app.</p>
      <span class="badge">Official pages</span>

      <section class="card" aria-label="Legal links">
        <a class="item" href="./data-deletion/">
          <span class="label">Data Deletion Request</span>
          <span class="hint">How users can request deletion and what data is retained.</span>
        </a>
        <a class="item" href="./terms-of-use/">
          <span class="label">Terms of Use</span>
          <span class="hint">Rules for using the app and purchase terms.</span>
        </a>
        <a class="item" href="./privacy-policy/">
          <span class="label">Privacy Policy</span>
          <span class="hint">How data is handled in the app.</span>
        </a>
      </section>
    </main>
  </body>
</html>
